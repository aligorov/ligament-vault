name: Ligament Vault CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-dry-run:
    name: ShellCheck, Web UI, Template Validation & Dry-Run Matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (age, shellcheck, python3-yaml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age shellcheck python3-yaml jq

      - name: Syntax check (bash -n, sh -n, python py_compile)
        run: |
          chmod +x install.sh ligactl clusterctl web/panel.py scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh scripts/hooks/*.sh
          for f in install.sh ligactl clusterctl scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh; do
            bash -n "$f"
          done
          sh -n scripts/hooks/ligament-2fa-hook.sh
          python3 -m py_compile web/panel.py

      - name: ShellCheck static analysis
        run: |
          shellcheck -x -S warning install.sh ligactl clusterctl scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh scripts/hooks/*.sh

      - name: Render templates, test Web Panel HTTPS API & full CLI --dry-run matrix
        run: |
          WORKDIR="$(mktemp -d)"
          cp -R . "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          DRY_RUN=true ./install.sh

          cp cluster.env.example cluster.env
          sed -i 's/FIXME_IP1:dc1:node1 FIXME_IP2:dc2:node2 FIXME_IP3:dc3:node3/10.0.1.10:dc1:node1 10.0.2.10:dc2:node2 10.0.3.10:dc3:node3/' cluster.env
          sed -i 's/ARBITER_IP=""/ARBITER_IP="198.51.100.50"/' cluster.env
          chmod 600 cluster.env

          export AGE_KEY_FILE="${WORKDIR}/age.key"
          ./ligactl secrets init
          ./ligactl secrets status

          # YAML and inline JS syntax checks
          python3 - <<'PYEOF'
          import pathlib, re, subprocess, tempfile, yaml
          for p in pathlib.Path("configs/prometheus").glob("*.yml*"):
              raw = p.read_text(encoding="utf-8")
              # Substitute template vars for *.tpl files before YAML parse check
              rendered = re.sub(r"\$\{[A-Za-z0-9_]+\}", "placeholder", raw)
              yaml.safe_load(rendered)
              print(f"YAML OK: {p}")
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
          assert scripts, "No <script> block found in web/index.html"
          if subprocess.run(["bash", "-c", "command -v node >/dev/null"], check=False).returncode == 0:
              for idx, js in enumerate(scripts):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as tf:
                      tf.write(js)
                      tpath = tf.name
                  subprocess.run(["node", "--check", tpath], check=True)
                  print(f"JS syntax OK: script #{idx}")
          PYEOF

          # Live HTTPS integration test of Web Panel (:18443) using real age-encrypted secrets!
          EXTRACTED_PW=$(
            source scripts/lib/common.sh
            load_cluster_env "${WORKDIR}/repo"
            echo "${SFTPGO_ADMIN_PASSWORD}"
          )
          PANEL_PORT=18443 PANEL_BIND=127.0.0.1 python3 web/panel.py &
          PANEL_PID=$!
          trap 'kill "${PANEL_PID}" 2>/dev/null || true' EXIT
          sleep 2
          curl -ksf https://127.0.0.1:18443/api/v1/health | jq -e '.ok == true'
          curl -ksf https://127.0.0.1:18443/ | grep -q "Ligament Vault"
          # Auth failure checks
          BAD_CODE=$(curl -ks -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:18443/api/v1/auth/login -H "Content-Type: application/json" -d '{"username":"admin","password":"wrong"}')
          [[ "${BAD_CODE}" == "401" || "${BAD_CODE}" == "403" ]]
          UNAUTH_CODE=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/api/v1/overview)
          [[ "${UNAUTH_CODE}" == "401" ]]

          curl -ksf -X POST https://127.0.0.1:18443/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"${EXTRACTED_PW}\"}" | jq -e '.ok == true'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview \
            | jq -e '.config.CLUSTER_SLUG == "ligament-vault" and .backup_configured == false'

          # Save S3 backup config with special chars ($, ", \) and verify age decrypt round-trip + overview
          python3 - "${EXTRACTED_PW}" <<'PYEOF'
          import json, ssl, sys, urllib.request
          pw = sys.argv[1]
          ctx = ssl._create_unverified_context()
          payload = {
              "BACKUP_S3_ENDPOINT": "https://s3.example.com",
              "BACKUP_S3_REGION": "eu-central-1",
              "BACKUP_S3_BUCKET": "vault-bk",
              "BACKUP_S3_ACCESS_KEY": "AK_CI_TEST",
              "BACKUP_S3_SECRET_KEY": 's3cr$t"key\\1',
          }
          req = urllib.request.Request(
              "https://127.0.0.1:18443/api/v1/config",
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"Bearer {pw}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, context=ctx, timeout=10) as r:
              assert r.status == 200, r.status
          PYEOF
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview \
            | jq -e '.backup_configured == true and .config.BACKUP_S3_REGION == "eu-central-1" and .config.BACKUP_S3_BUCKET == "vault-bk"'
          ROUNDTRIP_SK=$(
            source scripts/lib/common.sh
            load_cluster_env "${WORKDIR}/repo"
            printf '%s' "${BACKUP_S3_SECRET_KEY}"
          )
          python3 -c 'import sys; expected = "s3cr$t\"key\\1"; got = sys.argv[1]; assert got == expected, (got, expected)' "${ROUNDTRIP_SK}"

          # Preinstall node remove & task endpoint test via Panel API
          curl -ksf -X POST -H "Authorization: Bearer ${EXTRACTED_PW}" -H "Content-Type: application/json" \
            -d '{"CLUSTER_NODES":"10.0.1.10:dc1:node1 10.0.2.10:dc2:node2 10.0.3.10:dc3:node3 10.0.4.10:dc4:node4"}' \
            https://127.0.0.1:18443/api/v1/config >/dev/null
          curl -ksf -X POST -H "Authorization: Bearer ${EXTRACTED_PW}" -H "Content-Type: application/json" \
            -d '{"node":"node4","mode":"preinstall"}' \
            https://127.0.0.1:18443/api/v1/nodes/remove | jq -e '.ok == true'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview \
            | jq -e '(.health.nodes | length) == 3 and .health.nodes[2].node == "node3"'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/tasks | jq -e '.tasks | type == "array"'
          kill "${PANEL_PID}"

          ./ligactl preflight --dry-run
          ./ligactl install --dry-run --yes
          ./ligactl install --stage=3 --dry-run --yes
          ./ligactl sync-config --dry-run
          ./ligactl user add --username alice --profile dual --quota-gb 50 --generate-password --require-2fa --dry-run
          ./ligactl user list --dry-run
          ./ligactl pki status --dry-run
          ./ligactl pki rotate --all --dry-run --yes
          ./ligactl backup --dry-run
          ./ligactl backup --verify --dry-run
          ./ligactl dr verify-backup --dry-run
          ./ligactl verify --sprint 1 --dry-run
          ./ligactl verify --disruptive --dry-run --yes
          ./ligactl status --json --dry-run
          ./ligactl scale add --ip 10.0.4.10 --dc dc4 --dry-run --yes
          ./ligactl scale replace --old node2 --new-ip 10.0.2.99 --dry-run --yes
          ./ligactl scale expand-disk --node node1 --dir /mnt/nvme2 --max-volumes 10 --dry-run
          ./ligactl upgrade --dry-run --yes
          ./ligactl dr restore --latest --dry-run --yes
          ./ligactl publish-image --dry-run
          ./ligactl lab up --dry-run

          python3 -m json.tool configs/grafana/ligament-vault-dashboard.json >/dev/null

  live-patroni-etcd-bootstrap:
    name: Live Container Smoke Test (etcd mTLS + Patroni PG16 Bootstrap)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Patroni PG16 image
        run: docker build -t aligorov/ligament_vault_patroni:16 -f Dockerfile.patroni .

      - name: Bootstrap live mTLS etcd + Patroni + HAProxy and verify /primary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age jq
          HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
          WORKDIR="$(mktemp -d)"
          cp -R . "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          cp cluster.env.example cluster.env
          sed -i "s|FIXME_IP1:dc1:node1 FIXME_IP2:dc2:node2 FIXME_IP3:dc3:node3|${HOST_IP}:dc1:node1|" cluster.env
          sed -i 's|SWFS_DEFAULT_REPLICATION="100"|SWFS_DEFAULT_REPLICATION="000"|' cluster.env
          chmod 600 cluster.env
          export AGE_KEY_FILE="${WORKDIR}/age.key"
          ./ligactl secrets init

          export CONFIG_ROOT="${WORKDIR}/repo"
          export SCRIPT_DIR="${WORKDIR}/repo"
          source scripts/lib/common.sh
          source scripts/lib/deploy.sh
          load_cluster_env "${WORKDIR}/repo"

          export ETCD_DATA_DIR="${WORKDIR}/data/etcd"
          export PG_DATA_DIR="${WORKDIR}/data/postgresql"
          export SWFS_MASTER_DIR="${WORKDIR}/data/swfs-master"
          export SWFS_VOLUME_DIR="${WORKDIR}/data/seaweedfs"
          export SFTPGO_DATA_DIR="${WORKDIR}/data/sftpgo"
          export SFTPGO_TEMP_PATH="${WORKDIR}/data/sftpgo-temp"
          export HTTPS_PORT=8444
          mkdir -p "${ETCD_DATA_DIR}" "${PG_DATA_DIR}" "${SWFS_MASTER_DIR}" "${SWFS_VOLUME_DIR}" "${SFTPGO_DATA_DIR}/data" "${SFTPGO_DATA_DIR}/backups" "${SFTPGO_TEMP_PATH}"
          sudo chown -R 1000:1000 "${SFTPGO_DATA_DIR}" "${SFTPGO_TEMP_PATH}" "${SWFS_MASTER_DIR}" "${SWFS_VOLUME_DIR}"

          ensure_ca_exists
          CA_DIR="${WORKDIR}/repo/.pki/ca"
          CERT_OUT="${WORKDIR}/repo/certs/node1"
          mkdir -p "${CERT_OUT}"
          cp "${CA_DIR}/ca.crt" "${CERT_OUT}/ca.crt"
          SAN="IP:${HOST_IP},IP:127.0.0.1,DNS:node1,DNS:localhost"
          ACTIVE_CA_KEY="${CA_DIR}/ca.key"
          for role in "${PKI_ROLES[@]}"; do
              openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out "${CERT_OUT}/${role}.key" 2>/dev/null
              openssl req -new -sha256 -key "${CERT_OUT}/${role}.key" -out "${CERT_OUT}/${role}.csr" -subj "/CN=${role}/O=Ligament"
              _sign_csr_with_active_ca "${CA_DIR}" "${CERT_OUT}/${role}.csr" "${CERT_OUT}/${role}.crt" "${SAN}"
              chmod 644 "${CERT_OUT}/${role}.crt"
          done
          chmod 600 "${CERT_OUT}"/*.key
          sudo chown 1000:1000 "${CERT_OUT}"/swfs-*.key "${CERT_OUT}/pg-client.key" || true
          chmod 644 "${CERT_OUT}"/etcd-*.key "${CERT_OUT}/pg-server.key"

          mkdir -p "${WORKDIR}/repo/certs/ssl" "${WORKDIR}/repo/ssh-host-keys" "${WORKDIR}/repo/hooks"
          openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 7 \
              -keyout "${WORKDIR}/repo/certs/ssl/privkey.pem" \
              -out "${WORKDIR}/repo/certs/ssl/fullchain.pem" \
              -subj "/CN=files.company.com" -addext "subjectAltName=DNS:files.company.com" 2>/dev/null
          sudo chown 1000:1000 "${WORKDIR}/repo/certs/ssl/privkey.pem"
          chmod 644 "${WORKDIR}/repo/certs/ssl/fullchain.pem"
          ssh-keygen -t ed25519 -f "${WORKDIR}/repo/ssh-host-keys/id_ed25519" -N "" >/dev/null
          ssh-keygen -t ecdsa -b 256 -f "${WORKDIR}/repo/ssh-host-keys/id_ecdsa" -N "" >/dev/null
          ssh-keygen -t rsa -b 2048 -f "${WORKDIR}/repo/ssh-host-keys/id_rsa" -N "" >/dev/null
          chmod 600 "${WORKDIR}/repo"/ssh-host-keys/id_*
          chmod 644 "${WORKDIR}/repo"/ssh-host-keys/*.pub
          sudo chown 1000:1000 "${WORKDIR}/repo"/ssh-host-keys/id_*

          render_node_configs "${HOST_IP}" "dc1" "node1" "1" "new"
          RDIR="${WORKDIR}/repo/.rendered/node1"
          cp "${RDIR}/docker-compose.yml" "${WORKDIR}/repo/docker-compose.yml"
          cp "${RDIR}/.env" "${WORKDIR}/repo/.env"
          mkdir -p "${WORKDIR}/repo/configs/seaweedfs"
          cp "${RDIR}/patroni.yml" "${WORKDIR}/repo/configs/patroni.yml"
          cp "${RDIR}/haproxy-pg.cfg" "${WORKDIR}/repo/configs/haproxy-pg.cfg"
          cp "${RDIR}/pgbackrest.conf" "${WORKDIR}/repo/configs/pgbackrest.conf"
          cp "${RDIR}/sftpgo.json" "${WORKDIR}/repo/configs/sftpgo.json"
          cp "${RDIR}/revoked_user_certs.json" "${WORKDIR}/repo/configs/revoked_user_certs.json"
          cp "${RDIR}"/seaweedfs/* "${WORKDIR}/repo/configs/seaweedfs/"
          chmod 755 "${WORKDIR}" "${WORKDIR}/repo" "${WORKDIR}/repo/configs" "${WORKDIR}/repo/configs/seaweedfs" "${WORKDIR}/repo/certs" "${CERT_OUT}" "${WORKDIR}/repo/certs/ssl" "${WORKDIR}/repo/ssh-host-keys" "${WORKDIR}/repo/hooks"
          chmod 644 "${WORKDIR}/repo/configs/haproxy-pg.cfg" "${WORKDIR}/repo/docker-compose.yml"
          chmod 600 "${WORKDIR}/repo/configs/seaweedfs/"*.toml "${WORKDIR}/repo/configs/seaweedfs/s3.json"
          sudo chown 1000:1000 "${WORKDIR}/repo/configs/sftpgo.json" "${WORKDIR}/repo/configs/revoked_user_certs.json" "${WORKDIR}/repo/configs/seaweedfs/"*.toml "${WORKDIR}/repo/configs/seaweedfs/s3.json"

          cleanup() {
              docker compose -f "${WORKDIR}/repo/docker-compose.yml" down -v || true
          }
          trap cleanup EXIT

          docker compose up -d etcd
          for _ in $(seq 1 25); do
              if docker exec "$(docker ps -qf name=etcd)" etcdctl \
                  --endpoints="https://127.0.0.1:2379" \
                  --cacert=/certs/ca.crt --cert=/certs/etcd-client.crt --key=/certs/etcd-client.key \
                  endpoint health >/dev/null 2>&1; then
                  break
              fi
              sleep 1
          done

          docker compose up -d patroni
          PRIMARY_OK=false
          for _ in $(seq 1 45); do
              if curl -sf http://127.0.0.1:8008/primary >/dev/null; then
                  PRIMARY_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${PRIMARY_OK}" != "true" ]]; then
              docker compose logs patroni || true
              curl -s http://127.0.0.1:8008/patroni || true
              exit 1
          fi
          docker exec "$(docker ps -qf name=patroni)" patronictl list

          docker compose up -d haproxy
          HAPROXY_OK=false
          for _ in $(seq 1 15); do
              if nc -z 127.0.0.1 5433 2>/dev/null; then
                  HAPROXY_OK=true
                  break
              fi
              sleep 1
          done
          if [[ "${HAPROXY_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs haproxy || true
              exit 1
          fi

          docker exec -i -e "SFTPGO_PW=${SFTPGO_DB_PASSWORD}" -e "SWFS_PW=${SWFS_FILER_DB_PASSWORD}" "$(docker ps -qf name=patroni)" python3 - <<'PYEOF'
          import os, psycopg2
          from psycopg2 import sql
          conn = psycopg2.connect(dbname="postgres", user="postgres", host="/var/run/postgresql")
          conn.autocommit = True
          cur = conn.cursor()
          for role, pw, db in [("sftpgo", os.environ["SFTPGO_PW"], "sftpgo"), ("seaweedfs", os.environ["SWFS_PW"], "seaweedfs_filer")]:
              cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
              if not cur.fetchone():
                  cur.execute(sql.SQL("CREATE USER {} WITH PASSWORD %s").format(sql.Identifier(role)), (pw,))
              cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
              if not cur.fetchone():
                  cur.execute(sql.SQL("CREATE DATABASE {} OWNER {}").format(sql.Identifier(db), sql.Identifier(role)))
          cur.close()
          conn.close()
          PYEOF

          docker compose up -d swfs-master swfs-volume
          MASTER_OK=false
          for _ in $(seq 1 30); do
              if curl -sf http://127.0.0.1:9333/cluster/status | jq -e '.Leader != ""' >/dev/null 2>&1; then
                  MASTER_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${MASTER_OK}" != "true" ]]; then
              docker compose logs swfs-master swfs-volume || true
              exit 1
          fi
          docker compose up -d swfs-filer swfs-s3 || {
              docker compose ps -a || true
              docker compose logs swfs-filer swfs-s3 swfs-master swfs-volume || true
              exit 1
          }
          S3_OK=false
          for _ in $(seq 1 30); do
              if nc -z 127.0.0.1 8333 >/dev/null 2>&1; then
                  S3_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${S3_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs swfs-filer swfs-s3 || true
              exit 1
          fi

          docker exec -i "$(docker ps -qf name=swfs-filer)" weed shell -master=127.0.0.1:9333 <<< 'fs.ls /'

          sudo python3 - <<'PYEOF'
          import datetime, glob, hashlib, hmac, json, os, urllib.error, urllib.request

          s3_files = glob.glob("**/s3.json", recursive=True)
          if not s3_files:
              raise RuntimeError("s3.json not found in smoke workspace")
          with open(s3_files[0], encoding="utf-8") as fh:
              s3_cfg = json.load(fh)
          creds = s3_cfg["identities"][0]["credentials"][0]
          ak, sk = creds["accessKey"], creds["secretKey"]
          port = "8333"
          endpoint = f"http://127.0.0.1:{port}"
          region = "us-east-1"

          def sign(key, msg):
              return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()

          def s3_req(method, path, query="", body=b"", extra_headers=None):
              extra_headers = extra_headers or {}
              now = datetime.datetime.now(datetime.timezone.utc)
              amz_date = now.strftime("%Y%m%dT%H%M%SZ")
              date_stamp = now.strftime("%Y%m%d")
              payload_hash = hashlib.sha256(body).hexdigest()
              headers = {
                  "host": f"127.0.0.1:{port}",
                  "x-amz-date": amz_date,
                  "x-amz-content-sha256": payload_hash,
                  **{k.lower(): v for k, v in extra_headers.items()},
              }
              sorted_keys = sorted(headers.keys())
              canonical_headers = "".join(f"{k}:{headers[k]}\n" for k in sorted_keys)
              signed_headers = ";".join(sorted_keys)
              canonical_request = f"{method}\n{path}\n{query}\n{canonical_headers}\n{signed_headers}\n{payload_hash}"
              scope = f"{date_stamp}/{region}/s3/aws4_request"
              string_to_sign = f"AWS4-HMAC-SHA256\n{amz_date}\n{scope}\n{hashlib.sha256(canonical_request.encode()).hexdigest()}"
              k_signing = sign(sign(sign(sign(("AWS4" + sk).encode("utf-8"), date_stamp), region), "s3"), "aws4_request")
              sig = hmac.new(k_signing, string_to_sign.encode("utf-8"), hashlib.sha256).hexdigest()
              headers["authorization"] = f"AWS4-HMAC-SHA256 Credential={ak}/{scope}, SignedHeaders={signed_headers}, Signature={sig}"
              url = f"{endpoint}{path}" + (f"?{query}" if query else "")
              req = urllib.request.Request(url, data=body if method in ("PUT", "POST") else None, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          for bname, lock in [("sftp-work", False), ("sftp-worm", True)]:
              hdrs = {"x-amz-bucket-object-lock-enabled": "true"} if lock else {}
              st, txt = s3_req("PUT", f"/{bname}", extra_headers=hdrs)
              if st not in (200, 204, 409) and "BucketAlready" not in txt:
                  raise RuntimeError(f"Failed creating bucket {bname}: HTTP {st} {txt}")
              ver_xml = b'<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
              st, txt = s3_req("PUT", f"/{bname}", query="versioning=", body=ver_xml, extra_headers={"content-type": "application/xml"})
              if st not in (200, 204):
                  raise RuntimeError(f"Failed versioning {bname}: HTTP {st} {txt}")

          lock_cfg_xml = (
              '<ObjectLockConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/">'
              '<ObjectLockEnabled>Enabled</ObjectLockEnabled>'
              '<Rule><DefaultRetention><Mode>COMPLIANCE</Mode><Days>365</Days></DefaultRetention></Rule>'
              '</ObjectLockConfiguration>'
          ).encode("utf-8")
          st, txt = s3_req("PUT", "/sftp-worm", query="object-lock=", body=lock_cfg_xml, extra_headers={"content-type": "application/xml"})
          if st not in (200, 204):
              raise RuntimeError(f"Failed setting DefaultRetention on sftp-worm: HTTP {st} {txt}")
          st, lock_xml = s3_req("GET", "/sftp-worm", query="object-lock=")
          print(f"Object Lock verified (HTTP {st}): {lock_xml.strip()}")
          if st != 200 or "COMPLIANCE" not in lock_xml:
              raise RuntimeError("DefaultRetention not confirmed")
          PYEOF

          docker compose up -d swfs-admin swfs-worker
          SWFS_ADMIN_OK=false
          for _ in $(seq 1 20); do
              if nc -z 127.0.0.1 12535 2>/dev/null; then
                  SWFS_ADMIN_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${SWFS_ADMIN_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs swfs-admin swfs-worker || true
              exit 1
          fi
          sleep 4
          if ! docker ps -f name=swfs-worker --format '{{.State}}' | grep -qx 'running' || ! docker ps -f name=swfs-admin --format '{{.State}}' | grep -qx 'running'; then
              docker compose ps -a || true
              docker compose logs swfs-admin swfs-worker || true
              exit 1
          fi
          if docker compose logs swfs-admin swfs-worker 2>&1 | grep -qiE "flag provided but not defined|Default Usage|permission denied"; then
              docker compose logs swfs-admin swfs-worker || true
              exit 1
          fi

          if ! docker compose run --rm --no-deps sftpgo sftpgo initprovider --config-file /etc/sftpgo/sftpgo.json; then
              docker compose ps -a || true
              docker compose logs sftpgo || true
              exit 1
          fi
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=21
          docker compose up -d sftpgo
          SFTP_OK=false
          for _ in $(seq 1 25); do
              if docker exec "$(docker ps -qf name=sftpgo)" sftpgo ping --config-file /etc/sftpgo/sftpgo.json >/dev/null 2>&1; then
                  SFTP_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${SFTP_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs sftpgo || true
              exit 1
          fi
          docker exec "$(docker ps -qf name=sftpgo)" sftpgo ping --config-file /etc/sftpgo/sftpgo.json
          curl -sf http://127.0.0.1:8081/healthz
          nc -z 127.0.0.1 2022
          nc -z 127.0.0.1 21

          # 1. Verify SFTPGo HTTPS WebClient endpoint serves TLS + HTTP 200 (after redirect if any)
          WC_CODE=""
          for _ in $(seq 1 5); do
              WC_CODE=$(curl -ksSL -o /dev/null -w '%{http_code}' https://127.0.0.1:8444/web/client/login || echo "err")
              [[ "${WC_CODE}" == "200" ]] && break
              sleep 1
          done
          echo "SFTPGo WebClient final HTTP code: ${WC_CODE}"
          curl -ksSI https://127.0.0.1:8444/web/client/login | grep -iE 'HTTP/|Location:' || true
          if [[ "${WC_CODE}" != "200" ]]; then
              docker compose logs sftpgo || true
              exit 1
          fi

          # 2. Verify SeaweedFS volume.fix.replication (default dry-run without -apply) output and regex
          FIX_OUT=$(docker exec -i "$(docker compose ps -q swfs-filer | head -n1)" weed shell -master=127.0.0.1:9333 <<< 'volume.fix.replication' 2>&1 || true)
          echo "volume.fix.replication output:"
          echo "${FIX_OUT}"
          if echo "${FIX_OUT}" | grep -qiE "replicating|copying|deleting|under-replicated|over-replicated|flag provided|\bERR\b|error:"; then
              echo "ERROR: Unexpected match in volume.fix.replication output!"
              exit 1
          fi

          # 3. Verify SeaweedFS 4.02 & Patroni 3.3 Prometheus metric names match alerts.yml / Grafana
          echo "SeaweedFS :9325/metrics sample (disk/resource):"
          SWFS_METRICS=$(curl -sf http://127.0.0.1:9325/metrics)
          echo "${SWFS_METRICS}" | grep -iE 'volumeServer_resource|volumeServer_max_volumes' | head -n 20
          echo "${SWFS_METRICS}" | grep -q 'SeaweedFS_volumeServer_resource{.*type="free"'
          echo "${SWFS_METRICS}" | grep -q 'SeaweedFS_volumeServer_resource{.*type="all"'
          echo "Patroni :8008/metrics sample:"
          PAT_METRICS=$(curl -sf http://127.0.0.1:8008/metrics)
          echo "${PAT_METRICS}" | grep -E '^(patroni_|# HELP patroni_)' | head -n 30

          # 4. Verify weed shell fs.meta.save and fs.meta.load against live filer
          FILER_CID=$(docker compose ps -q swfs-filer | head -n1)
          docker exec -i "${FILER_CID}" weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 <<< 'fs.meta.save -o /tmp/ci-filer-meta.bin /'
          docker exec "${FILER_CID}" test -s /tmp/ci-filer-meta.bin
          docker exec -i "${FILER_CID}" weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 <<< 'fs.meta.load -v=false /tmp/ci-filer-meta.bin'
          docker exec "${FILER_CID}" rm -f /tmp/ci-filer-meta.bin

          # 5. Verify Patroni PATCH /config (Basic Auth) slot add + delete cleanup
          curl -sf -u "patroni:${PATRONI_API_PASSWORD}" -X PATCH http://127.0.0.1:8008/config -H "Content-Type: application/json" -d '{"slots":{"ci_test_slot":{"type":"physical"}}}' | jq -e '.slots.ci_test_slot.type == "physical"'
          curl -sf -u "patroni:${PATRONI_API_PASSWORD}" -X PATCH http://127.0.0.1:8008/config -H "Content-Type: application/json" -d '{"slots":{"ci_test_slot":null}}' | jq -e '.slots.ci_test_slot == null'

          # 6. Live E2E SFTPGo REST API + --require-2fa totp_config + per-user S3 isolation + SFTP /work & /worm (Object Lock)
          ssh-keygen -t ed25519 -f "${WORKDIR}/ci_user_key" -N "" >/dev/null
          CI_PUBKEY=$(cat "${WORKDIR}/ci_user_key.pub")
          python3 - "${SFTPGO_ADMIN_USERNAME:-admin}" "${SFTPGO_ADMIN_PASSWORD}" "sftpgo-s3-access" "${SWFS_S3_SECRET_KEY_SFTPGO}" "${CI_PUBKEY}" <<'PYEOF'
          import base64, json, sys, urllib.error, urllib.request
          admin_u, admin_p, s3_ak, s3_sk, pubkey = sys.argv[1:]
          base = "http://127.0.0.1:8081/api/v2"
          b64 = base64.b64encode(f"{admin_u}:{admin_p}".encode()).decode()

          def req(method, path, body=None, hdr=None):
              h = {"Content-Type": "application/json", **(hdr or {})}
              r = urllib.request.Request(f"{base}{path}", data=json.dumps(body).encode() if body is not None else None, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=15) as resp:
                      raw = resp.read().decode()
                      return resp.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          st, tok_res = req("GET", "/token", hdr={"Authorization": f"Basic {b64}"})
          assert st == 200, (st, tok_res)
          auth = {"Authorization": f"Bearer {tok_res['access_token']}"}

          def mk_folder(name, bucket, prefix=""):
              s3c = {
                  "bucket": bucket, "region": "us-east-1", "endpoint": "http://127.0.0.1:8333",
                  "access_key": s3_ak, "access_secret": {"status": "Plain", "payload": s3_sk},
                  "force_path_style": True, "skip_tls_verify": True,
              }
              if prefix:
                  s3c["key_prefix"] = prefix
              payload = {"name": name, "filesystem": {"provider": 1, "s3config": s3c}}
              st_f, res_f = req("POST", "/folders", body=payload, hdr=auth)
              assert st_f in (200, 201), f"POST /folders {name} -> {st_f}: {res_f}"
              return res_f

          mk_folder("sftp-work", "sftp-work")
          mk_folder("sftp-worm", "sftp-worm")
          mk_folder("user-ciuser-work", "sftp-work", "users/ciuser/")
          mk_folder("user-ciuser-worm", "sftp-worm", "users/ciuser/")

          u_payload = {
              "username": "ciuser", "status": 1, "password": "CiUserPass!2026",
              "home_dir": "/srv/sftpgo/data/ciuser",
              "public_keys": [pubkey.strip()],
              "permissions": {"/": ["list"], "/work": ["*"], "/worm": ["list", "upload", "download", "create_dirs"]},
              "filesystem": {"provider": 0},
              "virtual_folders": [
                  {"name": "user-ciuser-work", "virtual_path": "/work", "quota_size": -1, "quota_files": -1},
                  {"name": "user-ciuser-worm", "virtual_path": "/worm", "quota_size": -1, "quota_files": -1},
              ],
          }
          st_u, res_u = req("POST", "/users", body=u_payload, hdr=auth)
          assert st_u in (200, 201), f"POST /users ciuser -> {st_u}: {res_u}"

          # Verify PUT user update works without sending redacted password back
          st_g, existing = req("GET", "/users/ciuser", hdr=auth)
          assert st_g == 200, (st_g, existing)
          existing.pop("password", None)
          existing["description"] = "updated-without-pw"
          st_p, res_p = req("PUT", "/users/ciuser", body=existing, hdr=auth)
          assert st_p in (200, 204), f"PUT /users/ciuser -> {st_p}: {res_p}"

          # Verify SFTPGo v2.7 accepts totp_config (--require-2fa)
          u2fa = {
              "username": "ci2fa", "status": 1, "password": "Ci2faPass!2026",
              "home_dir": "/srv/sftpgo/data/ci2fa",
              "permissions": {"/": ["list"], "/work": ["*"]},
              "filesystem": {"provider": 0},
              "virtual_folders": [{"name": "sftp-work", "virtual_path": "/work", "quota_size": -1, "quota_files": -1}],
              "filters": {"totp_config": {"enabled": True, "config_name": "Default", "protocols": ["SSH", "FTP", "HTTP"]}},
          }
          st_2fa, res_2fa = req("POST", "/users", body=u2fa, hdr=auth)
          print(f"POST /users ci2fa (totp_config) -> {st_2fa}")
          assert st_2fa in (200, 201), f"POST /users ci2fa failed -> {st_2fa}: {res_2fa}"
          PYEOF

          # Real SFTP transfer test into /work and /worm (Object Lock)
          echo "hello work ci" > "${WORKDIR}/work_sample.txt"
          echo "immutable worm ci" > "${WORKDIR}/worm_sample.txt"
          if ! sftp -b - -P 2022 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i "${WORKDIR}/ci_user_key" ciuser@127.0.0.1 <<SFTPEOF
          put ${WORKDIR}/work_sample.txt /work/work_sample.txt
          get /work/work_sample.txt ${WORKDIR}/work_dl.txt
          rm /work/work_sample.txt
          put ${WORKDIR}/worm_sample.txt /worm/worm_sample.txt
          ls -la /worm
          bye
          SFTPEOF
          then
              docker compose logs --tail 50 sftpgo swfs-s3 swfs-filer swfs-master || true
              exit 1
          fi
          cmp -s "${WORKDIR}/work_sample.txt" "${WORKDIR}/work_dl.txt"
          if sftp -b - -P 2022 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i "${WORKDIR}/ci_user_key" ciuser@127.0.0.1 <<< 'rm /worm/worm_sample.txt'; then
              echo "ERROR: WORM folder permitted rm!"
              exit 1
          fi
          echo "Confirmed SFTP rm on /worm is denied as expected"

          # Verify object stored under prefix users/ciuser/ in sftp-worm AND check Object Lock retention + delete denial
          sudo python3 - "sftpgo-s3-access" "${SWFS_S3_SECRET_KEY_SFTPGO}" <<'PYEOF'
          import datetime, hashlib, hmac, sys, urllib.error, urllib.parse, urllib.request
          ak, sk = sys.argv[1:]
          endpoint = "http://127.0.0.1:8333"
          region = "us-east-1"

          def sign(k, m):
              return hmac.new(k, m.encode("utf-8"), hashlib.sha256).digest()

          def s3_req(method, path, query=""):
              # SigV4: каноничный query обязан быть URL-encoded (RFC 3986) и отсортирован по ключу
              pairs = []
              for part in [p for p in query.split("&") if p]:
                  k, _, v = part.partition("=")
                  pairs.append((urllib.parse.quote(k, safe="-_.~"), urllib.parse.quote(v, safe="-_.~")))
              query = "&".join(f"{k}={v}" for k, v in sorted(pairs))
              now = datetime.datetime.now(datetime.timezone.utc)
              amz = now.strftime("%Y%m%dT%H%M%SZ")
              ds = now.strftime("%Y%m%d")
              ph = hashlib.sha256(b"").hexdigest()
              hdrs = {"host": "127.0.0.1:8333", "x-amz-date": amz, "x-amz-content-sha256": ph}
              sks = sorted(hdrs)
              ch = "".join(f"{k}:{hdrs[k]}\n" for k in sks)
              sh = ";".join(sks)
              cr = f"{method}\n{path}\n{query}\n{ch}\n{sh}\n{ph}"
              sc = f"{ds}/{region}/s3/aws4_request"
              sts = f"AWS4-HMAC-SHA256\n{amz}\n{sc}\n{hashlib.sha256(cr.encode()).hexdigest()}"
              ks = sign(sign(sign(sign(("AWS4" + sk).encode(), ds), region), "s3"), "aws4_request")
              hdrs["authorization"] = f"AWS4-HMAC-SHA256 Credential={ak}/{sc}, SignedHeaders={sh}, Signature={hmac.new(ks, sts.encode(), hashlib.sha256).hexdigest()}"
              req = urllib.request.Request(f"{endpoint}{path}" + (f"?{query}" if query else ""), headers=hdrs, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          st_all, xml_all = s3_req("GET", "/sftp-worm", "list-type=2")
          print(f"sftp-worm FULL list (HTTP {st_all}): {xml_all}")
          st_ls, xml_ls = s3_req("GET", "/sftp-worm", "list-type=2&prefix=users/ciuser/")
          print(f"sftp-worm list (HTTP {st_ls}): {xml_ls}")
          assert st_ls == 200 and "users/ciuser/worm_sample.txt" in xml_ls, (st_ls, xml_ls)

          st_ret, xml_ret = s3_req("GET", "/sftp-worm/users/ciuser/worm_sample.txt", "retention=")
          print(f"sftp-worm retention (HTTP {st_ret}): {xml_ret}")
          assert st_ret == 200 and "COMPLIANCE" in xml_ret, (st_ret, xml_ret)

          st_ver, xml_ver = s3_req("GET", "/sftp-worm", "prefix=users/ciuser/&versions=")
          print(f"sftp-worm versions (HTTP {st_ver}): {xml_ver}")
          PYEOF

          echo "LIVE_STACK_SMOKE_OK"
