              cur_ak = use_ak or ak
              cur_sk = use_sk or sk
              # SigV4: каноничный query обязан быть URL-encoded (RFC 3986) и отсортирован по ключу
              pairs = []
              for part in [p for p in query.split("&") if p]:
                  k, _, v = part.partition("=")
                  pairs.append((urllib.parse.quote(k, safe="-_.~"), urllib.parse.quote(v, safe="-_.~")))
              query = "&".join(f"{k}={v}" for k, v in sorted(pairs))
              now = datetime.datetime.now(datetime.timezone.utc)
              amz = now.strftime("%Y%m%dT%H%M%SZ")
              ds = now.strftime("%Y%m%d")
              ph = hashlib.sha256(body).hexdigest()
              hdrs = {"host": "127.0.0.1:8333", "x-amz-date": amz, "x-amz-content-sha256": ph}
              sks = sorted(hdrs)
              ch = "".join(f"{k}:{hdrs[k]}\n" for k in sks)
              sh = ";".join(sks)
              cr = f"{method}\n{path}\n{query}\n{ch}\n{sh}\n{ph}"
              sc = f"{ds}/{region}/s3/aws4_request"
              sts = f"AWS4-HMAC-SHA256\n{amz}\n{sc}\n{hashlib.sha256(cr.encode()).hexdigest()}"
              ks = sign(sign(sign(sign(("AWS4" + cur_sk).encode(), ds), region), "s3"), "aws4_request")
              hdrs["authorization"] = f"AWS4-HMAC-SHA256 Credential={cur_ak}/{sc}, SignedHeaders={sh}, Signature={hmac.new(ks, sts.encode(), hashlib.sha256).hexdigest()}"
              req = urllib.request.Request(f"{endpoint}{path}" + (f"?{query}" if query else ""), data=body if method == "PUT" else None, headers=hdrs, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          # H-3 Proof: sftpgo-service MUST NOT be able to alter bucket ObjectLockConfiguration
          weak_xml = b'<ObjectLockConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><ObjectLockEnabled>Enabled</ObjectLockEnabled><Rule><DefaultRetention><Mode>GOVERNANCE</Mode><Days>1</Days></DefaultRetention></Rule></ObjectLockConfiguration>'
          st_tamper, _ = s3_req("PUT", "/sftp-worm", "object-lock=", body=weak_xml, use_ak=sftp_ak, use_sk=sftp_sk)
          print(f"sftpgo-service tamper DefaultRetention attempt -> HTTP {st_tamper}")
          assert st_tamper == 403, f"SECURITY FAILURE: sftpgo-service modified ObjectLockConfiguration (HTTP {st_tamper})"

          st_all, xml_all = s3_req("GET", "/sftp-worm", "list-type=2")
          print(f"sftp-worm FULL list (HTTP {st_all}): {xml_all}")
          st_ls, xml_ls = s3_req("GET", "/sftp-worm", "list-type=2&prefix=users/ciuser/")
          print(f"sftp-worm list (HTTP {st_ls}): {xml_ls}")
          assert st_ls == 200 and "<Key>users/ciuser/worm_sample.txt</Key>" in xml_ls and "users/ciuser/users/ciuser/" not in xml_ls, (st_ls, xml_ls)

          st_ret, xml_ret = s3_req("GET", "/sftp-worm/users/ciuser/worm_sample.txt", "retention=")
          print(f"sftp-worm retention (HTTP {st_ret}): {xml_ret}")
          assert st_ret == 200 and "COMPLIANCE" in xml_ret, (st_ret, xml_ret)

          st_ver, xml_ver = s3_req("GET", "/sftp-worm", "prefix=users/ciuser/&versions=")
          print(f"sftp-worm versions (HTTP {st_ver}): {xml_ver}")
          import re
          m = re.search(r"<VersionId>([^<]+)</VersionId>", xml_ver)
          assert m, xml_ver
          vid = m.group(1)
          st_del, xml_del = s3_req("DELETE", "/sftp-worm/users/ciuser/worm_sample.txt", f"versionId={vid}")
          print(f"sftp-worm raw S3 version DELETE under COMPLIANCE (HTTP {st_del}): {xml_del}")
          assert st_del in (400, 403), f"Expected WORM COMPLIANCE to deny version delete, got {st_del}: {xml_del}"
          PYEOF

          echo "LIVE_STACK_SMOKE_OK"

  multi-node-e2e-install:
    name: Live 3-Node Cluster E2E Install (Stages 0-5 + 3GB Disk + Cloud FW Bridge + Cross-Node SFTP/WORM)
    runs-on: ${{ inputs.vps_runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.scale_ha && 75 || 20 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Patroni & stack images + systemd VPS node image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age apache2-utils jq sshpass

          docker build -t aligorov/ligament_vault_patroni:16 -f Dockerfile.patroni .
          for img in quay.io/coreos/etcd:v3.5.17 haproxy:3.0-alpine chrislusf/seaweedfs:4.55 drakkan/sftpgo:v2.7-alpine prom/node-exporter:v1.8.2; do
            docker pull -q "${img}"
          done

          mkdir -p /tmp/lv-e2e/node-img
          cat > /tmp/lv-e2e/node-img/Dockerfile <<'NODEDF'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive container=docker
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              systemd systemd-sysv dbus openssh-server sudo ca-certificates curl jq \
              iproute2 iputils-ping iptables ufw fail2ban python3-systemd chrony \
              python3 python3-yaml netcat-openbsd conntrack openssl docker.io docker-compose-v2 dnsmasq-base \
              && rm -rf /var/lib/apt/lists/* \
              && mkdir -p /etc/docker && echo '{"dns":["172.28.0.10"]}' > /etc/docker/daemon.json \
              && mkdir -p /run/sshd /root/.ssh && chmod 700 /root/.ssh \
              && rm -f /lib/systemd/system/multi-user.target.wants/*getty* \
              && systemctl mask systemd-resolved.service systemd-networkd.service systemd-timesyncd.service \
              && systemctl enable ssh.service containerd.service docker.service
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          NODEDF
          sed -i 's/^          //' /tmp/lv-e2e/node-img/Dockerfile
          docker build -t ci-vps-node:24.04 /tmp/lv-e2e/node-img

          docker save -o /tmp/lv-e2e/base-images.tar \
            quay.io/coreos/etcd:v3.5.17 \
            haproxy:3.0-alpine \
            chrislusf/seaweedfs:4.55 \
            drakkan/sftpgo:v2.7-alpine \
            prom/node-exporter:v1.8.2
          docker save -o /tmp/lv-e2e/patroni-image.tar aligorov/ligament_vault_patroni:16

      - name: Boot 3 Ubuntu 24.04 systemd+DinD nodes & run full './ligactl install --yes' + Cross-Node SFTP/WORM
        run: |
          set -euo pipefail
          WORKDIR="/tmp/lv-e2e"
          vps_nodes=(1 2 3)
          if [[ '${{ inputs.scale_ha }}' == 'true' ]]; then
            vps_nodes+=(4 5 6)
            # Each nested dockerd stores its own images. Include room for PGDATA and the loopback disk.
            image_bytes=$(docker image inspect --format '{{.Size}}' aligorov/ligament_vault_patroni:16 quay.io/coreos/etcd:v3.5.17 haproxy:3.0-alpine chrislusf/seaweedfs:4.55 drakkan/sftpgo:v2.7-alpine prom/node-exporter:v1.8.2 | awk '{s+=$1} END {printf "%.0f",s}')
            docker_root=$(docker info --format '{{.DockerRootDir}}')
            available=$(df -B1 --output=avail "$docker_root" | tail -1)
            required=$((6 * image_bytes + 8 * 1024**3))
            (( available >= required )) || { echo "Nested scale test requires $required free bytes, available $available"; exit 1; }
          fi
          for idx in "${vps_nodes[@]}"; do mkdir -p "${WORKDIR}/data-${idx}"; done

          # Emulate compact 3GB disk on node2 (just like real 2.9GB VPS)
          truncate -s 3G "${WORKDIR}/node2-data.img"
          mkfs.ext4 -q "${WORKDIR}/node2-data.img"
          sudo mount -o loop "${WORKDIR}/node2-data.img" "${WORKDIR}/data-2"

          cleanup_e2e() {
            local rc=$?
            if (( rc != 0 )); then
              echo "=== E2E FAILURE DIAGNOSTICS ==="
              docker ps -a || true
              for idx in "${vps_nodes[@]}"; do
                n=lv-node${idx}
                echo "--- ${n} boot logs & containers ---"
                docker logs "${n}" --tail 35 2>&1 || true
                docker exec "${n}" bash -c 'docker ps -a; cd /opt/ligament-vault 2>/dev/null && docker compose logs --tail 35 || true' || true
              done
            fi
            sudo resolvectl revert br-lv-ci >/dev/null 2>&1 || true
            for idx in "${vps_nodes[@]}"; do
              docker rm -f "lv-node${idx}" >/dev/null 2>&1 || true
              docker volume rm -f "lv-docker-${idx}" "lv-ctrd-${idx}" >/dev/null 2>&1 || true
            done
            docker rm -f lv-dns >/dev/null 2>&1 || true
            docker network rm lv-wan-net >/dev/null 2>&1 || true
            sudo umount -l "${WORKDIR}/data-2" >/dev/null 2>&1 || true
          }
          trap cleanup_e2e EXIT

          docker network create -o com.docker.network.bridge.name=br-lv-ci --subnet=172.28.0.0/24 lv-wan-net
          docker run -d --name lv-dns --network lv-wan-net --ip 172.28.0.10 \
            --entrypoint /usr/sbin/dnsmasq ci-vps-node:24.04 -k --no-hosts --local=/ci.test/ \
            --host-record=node1.ci.test,files.ci.test,172.28.0.11 \
            --host-record=node2.ci.test,172.28.0.12 --host-record=node3.ci.test,172.28.0.13 \
            --host-record=node4.ci.test,172.28.0.14 --host-record=node5.ci.test,172.28.0.15 --host-record=replacement.ci.test,172.28.0.16
          sudo resolvectl dns br-lv-ci 172.28.0.10
          sudo resolvectl domain br-lv-ci '~ci.test'
          getent ahostsv4 files.ci.test | grep -F '172.28.0.11' >/dev/null

          for idx in "${vps_nodes[@]}"; do
            ip="172.28.0.1${idx}"
            docker run -d --name "lv-node${idx}" --hostname "node${idx}" \
              --network lv-wan-net --ip "${ip}" --dns 172.28.0.10 \
              --privileged --cgroupns=private \
              --tmpfs /tmp --tmpfs /run --tmpfs /run/lock \
              -v "lv-docker-${idx}:/var/lib/docker" \
              -v "lv-ctrd-${idx}:/var/lib/containerd" \
              -v "${WORKDIR}/data-${idx}:/data" \
              -v "${WORKDIR}/base-images.tar:/base-images.tar:ro" \
              -v "${WORKDIR}/patroni-image.tar:/patroni-image.tar:ro" \
              ci-vps-node:24.04
          done

          ssh-keygen -t ed25519 -f "${WORKDIR}/orch_id_ed25519" -N "" >/dev/null
          PUBKEY=$(cat "${WORKDIR}/orch_id_ed25519.pub")

          for idx in "${vps_nodes[@]}"; do
            n="lv-node${idx}"
            for _ in $(seq 1 40); do
              if docker exec "${n}" bash -c 'docker info >/dev/null 2>&1 && systemctl is-active --quiet ssh'; then
                break
              fi
              sleep 1
            done
            docker exec "${n}" docker info >/dev/null
            docker exec "${n}" bash -c "mkdir -p /root/.ssh && chmod 700 /root/.ssh && echo '${PUBKEY}' > /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys"
            docker exec "${n}" docker load -i /base-images.tar >/dev/null
          done

          # Seed Patroni image ONLY on node1 so Stage 3 exercises SSH P2P transfer to node2 and node3!
          DF_HASH=$(sha256sum Dockerfile.patroni | awk '{print $1}')
          docker exec lv-node1 docker load -i /patroni-image.tar >/dev/null
          docker exec lv-node1 bash -c "mkdir -p /opt/ligament-vault/build-patroni && echo '${DF_HASH}' > /opt/ligament-vault/build-patroni/.built.sha256"

          # Emulate neighboring service on node1:443 (like 2FA/Nginx) so Stage 0 auto-switches HTTPS_PORT -> 8444 & UFW preserves :443!
          docker exec -d lv-node1 python3 -c "import socket, time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('0.0.0.0', 443)); s.listen(8); time.sleep(3600)"

          # Emulate hostile Cloud Firewall: block ALL direct TCP SYN from node3 (172.28.0.13) to node1 (172.28.0.11) EXCEPT SSH :22!
          docker exec lv-node1 iptables -t raw -A PREROUTING -s 172.28.0.13/32 -p tcp --syn ! --dport 22 -j DROP

          cp -R . "${WORKDIR}/ctl"
          cd "${WORKDIR}/ctl"
          ./ligactl config init
          source scripts/lib/common.sh
          config_db_set_many CLUSTER_NODES "node1.ci.test:dc1:node1 node2.ci.test:dc2:node2 node3.ci.test:dc3:node3" \
              SSH_IDENTITY_FILE "${WORKDIR}/orch_id_ed25519" DOMAIN files.ci.test

          # 1. Run REAL full 3-node cluster installation (Stages 0..5)
          ./ligactl install --yes
          test -f "${WORKDIR}/ctl/.cluster_installed"
          test "$(config_db_get HTTPS_PORT)" = 8444
          python3 -c "import socket; s=socket.create_connection(('files.ci.test', 443), 3); s.close()"

          # Confirm transparent SSH+DNAT bridge automatically activated on node3 -> node1
          docker exec lv-node3 systemctl is-active --quiet ligament-vault-bridge-to-node1.service

          # 1b. Switchover Patroni Primary to node2 and test mid-Stage-3 '--resume' with live etcd + non-node1 Primary!
          docker exec lv-node1 bash -c 'PCID=$(cd /opt/ligament-vault && docker compose ps -q patroni | head -n1); docker exec "${PCID}" patronictl -c /run/pg-certs/patroni.yml switchover --candidate node2 --force'
          sleep 3
          rm -f "${WORKDIR}/ctl/.cluster_installed"
          mkdir -p "${WORKDIR}/ctl/.state"
          printf '%s\n' "stage-0-00-preflight" "stage-1-01-host-hardening" "stage-2-02-pki-secrets" > "${WORKDIR}/ctl/.state/checkpoints.install"
          docker exec lv-node3 bash -c 'cd /opt/ligament-vault && docker compose stop haproxy swfs-filer swfs-s3 swfs-volume swfs-master sftpgo 2>/dev/null || true'
          ./ligactl install --yes --resume
          test -f "${WORKDIR}/ctl/.cluster_installed"

          # 2. Verify idempotent sync-config (UFW + haproxy -c + hot reload) on live 3-node cluster
          ./ligactl sync-config

          # 3. Run Day-1 Sprint 1 S3 + WORM + SFTP acceptance suite
          ./ligactl verify --sprint 1

          # 4. Provision real SFTP client & verify cross-node SFTP upload on node1 -> download on node2 & node3 + WORM lock on node3
          ssh-keygen -t ed25519 -f "${WORKDIR}/sftp_client_key" -N "" >/dev/null
          CLIENT_PUB=$(cat "${WORKDIR}/sftp_client_key.pub")
          awk '{print "vault-ci " $1 " " $2}' ssh-host-keys/id_ed25519.pub > "${WORKDIR}/known_hosts"
          sftp_args=(-b - -P 2022 -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
                     -o "UserKnownHostsFile=${WORKDIR}/known_hosts" -o HostKeyAlias=vault-ci
                     -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes -i "${WORKDIR}/sftp_client_key")
          ./ligactl user add --username e2euser --profile dual --quota-gb 2 --ssh-key "${CLIENT_PUB}"

          echo "cross-node-work-payload-2026" > "${WORKDIR}/work_in.txt"
          echo "cross-node-worm-payload-2026" > "${WORKDIR}/worm_in.txt"

          sftp "${sftp_args[@]}" e2euser@files.ci.test <<SFTP_UP
          put ${WORKDIR}/work_in.txt /work/cross.txt
          put ${WORKDIR}/worm_in.txt /worm/immutable.txt
          bye
          SFTP_UP

          sftp "${sftp_args[@]}" e2euser@node2.ci.test <<SFTP_N2
          get /work/cross.txt ${WORKDIR}/work_n2.txt
          get /worm/immutable.txt ${WORKDIR}/worm_n2.txt
          bye
          SFTP_N2
          cmp -s "${WORKDIR}/work_in.txt" "${WORKDIR}/work_n2.txt"
          cmp -s "${WORKDIR}/worm_in.txt" "${WORKDIR}/worm_n2.txt"

          sftp "${sftp_args[@]}" e2euser@node3.ci.test <<SFTP_N3
          get /work/cross.txt ${WORKDIR}/work_n3.txt
          get /worm/immutable.txt ${WORKDIR}/worm_n3.txt
          bye
          SFTP_N3
          cmp -s "${WORKDIR}/work_in.txt" "${WORKDIR}/work_n3.txt"
          cmp -s "${WORKDIR}/worm_in.txt" "${WORKDIR}/worm_n3.txt"

          if sftp "${sftp_args[@]}" e2euser@node3.ci.test <<< 'rm /worm/immutable.txt'; then
            echo "ERROR: node3 permitted deleting WORM-protected file!" >&2
            exit 1
          fi

          # 5. Verify full cluster health JSON across all 3 nodes
          STATUS_OUT=$(./ligactl status --json)
          STATUS_JSON=$(echo "${STATUS_OUT}" | grep '^\{' | tail -n1)
          echo "Cluster status JSON: ${STATUS_JSON}"
          echo "${STATUS_JSON}" | jq -e '(.nodes | length) == 3 and .errors == 0 and (.nodes | all(.haproxy == "OK" and .swfs_volume == "OK" and .swfs_filer == "OK" and .sftpgo == "OK"))'

          echo "MULTI_NODE_3VPS_E2E_OK"

          if [[ '${{ inputs.scale_ha }}' == 'true' ]]; then
            for idx in 4 5 6; do
              docker exec "lv-node$idx" docker load -i /patroni-image.tar >/dev/null
              docker exec "lv-node$idx" sh -ec "mkdir -p /opt/ligament-vault/build-patroni && echo '$DF_HASH' > /opt/ligament-vault/build-patroni/.built.sha256"
            done
            check_scale() {
              local size="$1" edge="$2" state
              state=$(./ligactl status --json)
              jq -e --argjson size "$size" '.etcd_expected_voters == $size and .etcd_healthy_voters == $size and .pg_primaries == 1 and .swfs_replication_healthy and .errors == 0 and (.nodes | length) == $size' <<< "$state"
              sftp "${sftp_args[@]}" "e2euser@$edge" <<< "get /work/cross.txt ${WORKDIR}/scale-data.txt"
              cmp "${WORKDIR}/work_in.txt" "${WORKDIR}/scale-data.txt"
            }
            for idx in 4 5; do
              ./ligactl scale add --ip "node$idx.ci.test" --dc "dc$idx" --name "node$idx" --role quorum --yes
              check_scale "$idx" "node$idx.ci.test"
            done
            docker stop lv-node4
            ./ligactl scale replace --old node4 --new-ip replacement.ci.test --yes
            check_scale 5 replacement.ci.test
            check_scale 5 files.ci.test
            # Changing the target in the control DB must expose existing two-copy volumes.
            config_db_set SWFS_DEFAULT_REPLICATION 200
            if ./ligactl status --strict --json > "${WORKDIR}/old-layout.json"; then
              echo "Old two-copy volumes passed strict health for policy 200" >&2
              exit 1
            fi
            jq -e '.swfs_replication_healthy == false' "${WORKDIR}/old-layout.json"
            echo "QUORUM_SCALE_AND_REPLACE_OK"
          fi
