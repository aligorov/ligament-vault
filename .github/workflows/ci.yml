name: Ligament Vault CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-dry-run:
    name: ShellCheck, Web UI, Template Validation & Dry-Run Matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (age, shellcheck, python3-yaml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age shellcheck python3-yaml jq

      - name: Syntax check (bash -n, sh -n, python py_compile)
        run: |
          chmod +x install.sh ligactl clusterctl web/panel.py scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh scripts/hooks/*.sh
          for f in install.sh ligactl clusterctl scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh; do
            bash -n "$f"
          done
          sh -n scripts/hooks/ligament-2fa-hook.sh
          python3 -m py_compile web/panel.py

      - name: ShellCheck static analysis
        run: |
          shellcheck -x -S warning install.sh ligactl clusterctl scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh scripts/hooks/*.sh

      - name: Render templates, test Web Panel HTTPS API & full CLI --dry-run matrix
        run: |
          WORKDIR="$(mktemp -d)"
          cp -R . "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          DRY_RUN=true ./install.sh

          cp cluster.env.example cluster.env
          sed -i 's/FIXME_IP1:dc1:node1 FIXME_IP2:dc2:node2 FIXME_IP3:dc3:node3/10.0.1.10:dc1:node1 10.0.2.10:dc2:node2 10.0.3.10:dc3:node3/' cluster.env
          sed -i 's/ARBITER_IP=""/ARBITER_IP="198.51.100.50"/' cluster.env
          chmod 600 cluster.env

          export AGE_KEY_FILE="${WORKDIR}/age.key"
          ./ligactl secrets init
          ./ligactl secrets status

          # Live HTTPS integration test of Web Panel (:18443) using real age-encrypted secrets!
          EXTRACTED_PW=$(
            source scripts/lib/common.sh
            load_cluster_env "${WORKDIR}/repo"
            echo "${SFTPGO_ADMIN_PASSWORD}"
          )
          PANEL_PORT=18443 PANEL_BIND=127.0.0.1 python3 web/panel.py &
          PANEL_PID=$!
          trap 'kill "${PANEL_PID}" 2>/dev/null || true' EXIT
          sleep 2
          curl -ksf https://127.0.0.1:18443/api/v1/health | jq -e '.ok == true'
          curl -ksf https://127.0.0.1:18443/ | grep -q "Ligament Vault"
          curl -ksf -X POST https://127.0.0.1:18443/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"${EXTRACTED_PW}\"}" | jq -e '.ok == true'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview | jq -e '.config.CLUSTER_SLUG == "ligament-vault"'
          kill "${PANEL_PID}"

          ./ligactl preflight --dry-run
          ./ligactl install --dry-run --yes
          ./ligactl sync-config --dry-run
          ./ligactl user add --username alice --profile dual --quota-gb 50 --generate-password --require-2fa --dry-run
          ./ligactl user list --dry-run
          ./ligactl pki status --dry-run
          ./ligactl pki rotate --all --dry-run --yes
          ./ligactl verify --sprint 1 --dry-run
          ./ligactl verify --disruptive --dry-run --yes
          ./ligactl status --json --dry-run
          ./ligactl scale add --ip 10.0.4.10 --dc dc4 --dry-run --yes
          ./ligactl scale replace --old node2 --new-ip 10.0.2.99 --dry-run --yes
          ./ligactl scale expand-disk --node node1 --dir /mnt/nvme2 --max-volumes 10 --dry-run
          ./ligactl upgrade --dry-run --yes
          ./ligactl dr restore --latest --dry-run --yes
          ./ligactl publish-image --dry-run
          ./ligactl lab up --dry-run

          python3 -m json.tool configs/grafana/ligament-vault-dashboard.json >/dev/null

  live-patroni-etcd-bootstrap:
    name: Live Container Smoke Test (etcd mTLS + Patroni PG16 Bootstrap)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Patroni PG16 image
        run: docker build -t aligorov/ligament_vault_patroni:16 -f Dockerfile.patroni .

      - name: Bootstrap live mTLS etcd + Patroni + HAProxy and verify /primary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age jq
          HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
          WORKDIR="$(mktemp -d)"
          cp -R . "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          cp cluster.env.example cluster.env
          sed -i "s|FIXME_IP1:dc1:node1 FIXME_IP2:dc2:node2 FIXME_IP3:dc3:node3|${HOST_IP}:dc1:node1|" cluster.env
          chmod 600 cluster.env
          export AGE_KEY_FILE="${WORKDIR}/age.key"
          ./ligactl secrets init

          export CONFIG_ROOT="${WORKDIR}/repo"
          export SCRIPT_DIR="${WORKDIR}/repo"
          source scripts/lib/common.sh
          source scripts/lib/deploy.sh
          load_cluster_env "${WORKDIR}/repo"

          export ETCD_DATA_DIR="${WORKDIR}/data/etcd"
          export PG_DATA_DIR="${WORKDIR}/data/postgresql"
          export SWFS_MASTER_DIR="${WORKDIR}/data/swfs-master"
          export SWFS_VOLUME_DIR="${WORKDIR}/data/seaweedfs"
          export SFTPGO_DATA_DIR="${WORKDIR}/data/sftpgo"
          export SFTPGO_TEMP_PATH="${WORKDIR}/data/sftpgo-temp"
          export HTTPS_PORT=8444
          mkdir -p "${ETCD_DATA_DIR}" "${PG_DATA_DIR}" "${SWFS_MASTER_DIR}" "${SWFS_VOLUME_DIR}" "${SFTPGO_DATA_DIR}/data" "${SFTPGO_DATA_DIR}/backups" "${SFTPGO_TEMP_PATH}"
          sudo chown -R 1000:1000 "${SFTPGO_DATA_DIR}" "${SFTPGO_TEMP_PATH}" "${SWFS_MASTER_DIR}" "${SWFS_VOLUME_DIR}"

          ensure_ca_exists
          CA_DIR="${WORKDIR}/repo/.pki/ca"
          CERT_OUT="${WORKDIR}/repo/certs/node1"
          mkdir -p "${CERT_OUT}"
          cp "${CA_DIR}/ca.crt" "${CERT_OUT}/ca.crt"
          SAN="IP:${HOST_IP},IP:127.0.0.1,DNS:node1,DNS:localhost"
          ACTIVE_CA_KEY="${CA_DIR}/ca.key"
          for role in "${PKI_ROLES[@]}"; do
              openssl ecparam -genkey -name prime256v1 -out "${CERT_OUT}/${role}.key" 2>/dev/null
              openssl req -new -sha256 -key "${CERT_OUT}/${role}.key" -out "${CERT_OUT}/${role}.csr" -subj "/CN=${role}/O=Ligament"
              _sign_csr_with_active_ca "${CA_DIR}" "${CERT_OUT}/${role}.csr" "${CERT_OUT}/${role}.crt" "${SAN}"
              chmod 644 "${CERT_OUT}/${role}.crt"
          done
          chmod 600 "${CERT_OUT}"/*.key
          sudo chown 1000:1000 "${CERT_OUT}"/swfs-*.key || true
          chmod 644 "${CERT_OUT}"/etcd-*.key "${CERT_OUT}"/pg-*.key

          mkdir -p "${WORKDIR}/repo/certs/ssl" "${WORKDIR}/repo/ssh-host-keys" "${WORKDIR}/repo/hooks"
          openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 7 \
              -keyout "${WORKDIR}/repo/certs/ssl/privkey.pem" \
              -out "${WORKDIR}/repo/certs/ssl/fullchain.pem" \
              -subj "/CN=files.company.com" -addext "subjectAltName=DNS:files.company.com" 2>/dev/null
          sudo chown 1000:1000 "${WORKDIR}/repo/certs/ssl/privkey.pem"
          chmod 644 "${WORKDIR}/repo/certs/ssl/fullchain.pem"
          ssh-keygen -t ed25519 -f "${WORKDIR}/repo/ssh-host-keys/id_ed25519" -N "" >/dev/null
          ssh-keygen -t ecdsa -b 256 -f "${WORKDIR}/repo/ssh-host-keys/id_ecdsa" -N "" >/dev/null
          ssh-keygen -t rsa -b 2048 -f "${WORKDIR}/repo/ssh-host-keys/id_rsa" -N "" >/dev/null
          chmod 600 "${WORKDIR}/repo"/ssh-host-keys/id_*
          chmod 644 "${WORKDIR}/repo"/ssh-host-keys/*.pub
          sudo chown 1000:1000 "${WORKDIR}/repo"/ssh-host-keys/id_*

          render_node_configs "${HOST_IP}" "dc1" "node1" "1" "new"
          RDIR="${WORKDIR}/repo/.rendered/node1"
          cp "${RDIR}/docker-compose.yml" "${WORKDIR}/repo/docker-compose.yml"
          cp "${RDIR}/.env" "${WORKDIR}/repo/.env"
          mkdir -p "${WORKDIR}/repo/configs/seaweedfs"
          cp "${RDIR}/patroni.yml" "${WORKDIR}/repo/configs/patroni.yml"
          cp "${RDIR}/haproxy-pg.cfg" "${WORKDIR}/repo/configs/haproxy-pg.cfg"
          cp "${RDIR}/pgbackrest.conf" "${WORKDIR}/repo/configs/pgbackrest.conf"
          cp "${RDIR}/sftpgo.json" "${WORKDIR}/repo/configs/sftpgo.json"
          cp "${RDIR}/revoked_user_certs.json" "${WORKDIR}/repo/configs/revoked_user_certs.json"
          cp "${RDIR}"/seaweedfs/* "${WORKDIR}/repo/configs/seaweedfs/"
          chmod 755 "${WORKDIR}" "${WORKDIR}/repo" "${WORKDIR}/repo/configs" "${WORKDIR}/repo/configs/seaweedfs" "${WORKDIR}/repo/certs" "${CERT_OUT}" "${WORKDIR}/repo/certs/ssl" "${WORKDIR}/repo/ssh-host-keys" "${WORKDIR}/repo/hooks"
          chmod 644 "${WORKDIR}/repo/configs/haproxy-pg.cfg" "${WORKDIR}/repo/docker-compose.yml"
          chmod 600 "${WORKDIR}/repo/configs/seaweedfs/"*.toml "${WORKDIR}/repo/configs/seaweedfs/s3.json"
          sudo chown 1000:1000 "${WORKDIR}/repo/configs/sftpgo.json" "${WORKDIR}/repo/configs/revoked_user_certs.json" "${WORKDIR}/repo/configs/seaweedfs/"*.toml "${WORKDIR}/repo/configs/seaweedfs/s3.json"

          cleanup() {
              docker compose -f "${WORKDIR}/repo/docker-compose.yml" down -v || true
          }
          trap cleanup EXIT

          docker compose up -d etcd
          for _ in $(seq 1 25); do
              if docker exec "$(docker ps -qf name=etcd)" etcdctl \
                  --endpoints="https://127.0.0.1:2379" \
                  --cacert=/certs/ca.crt --cert=/certs/etcd-client.crt --key=/certs/etcd-client.key \
                  endpoint health >/dev/null 2>&1; then
                  break
              fi
              sleep 1
          done

          docker compose up -d patroni
          PRIMARY_OK=false
          for _ in $(seq 1 45); do
              if curl -sf http://127.0.0.1:8008/primary >/dev/null; then
                  PRIMARY_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${PRIMARY_OK}" != "true" ]]; then
              docker compose logs patroni || true
              curl -s http://127.0.0.1:8008/patroni || true
              exit 1
          fi
          docker exec "$(docker ps -qf name=patroni)" patronictl list

          docker compose up -d haproxy
          HAPROXY_OK=false
          for _ in $(seq 1 15); do
              if nc -z 127.0.0.1 5433 2>/dev/null; then
                  HAPROXY_OK=true
                  break
              fi
              sleep 1
          done
          if [[ "${HAPROXY_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs haproxy || true
              exit 1
          fi

          docker exec -i -e "SFTPGO_PW=${SFTPGO_DB_PASSWORD}" -e "SWFS_PW=${SWFS_FILER_DB_PASSWORD}" "$(docker ps -qf name=patroni)" python3 - <<'PYEOF'
          import os, psycopg2
          from psycopg2 import sql
          conn = psycopg2.connect(dbname="postgres", user="postgres", host="/var/run/postgresql")
          conn.autocommit = True
          cur = conn.cursor()
          for role, pw, db in [("sftpgo", os.environ["SFTPGO_PW"], "sftpgo"), ("seaweedfs", os.environ["SWFS_PW"], "seaweedfs_filer")]:
              cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
              if not cur.fetchone():
                  cur.execute(sql.SQL("CREATE USER {} WITH PASSWORD %s").format(sql.Identifier(role)), (pw,))
              cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
              if not cur.fetchone():
                  cur.execute(sql.SQL("CREATE DATABASE {} OWNER {}").format(sql.Identifier(db), sql.Identifier(role)))
          cur.close()
          conn.close()
          PYEOF

          docker compose up -d swfs-master swfs-volume
          MASTER_OK=false
          for _ in $(seq 1 30); do
              if curl -sf http://127.0.0.1:9333/cluster/status | jq -e '.Leader != ""' >/dev/null 2>&1; then
                  MASTER_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${MASTER_OK}" != "true" ]]; then
              docker compose logs swfs-master swfs-volume || true
              exit 1
          fi
          docker compose up -d swfs-filer swfs-s3
          S3_OK=false
          for _ in $(seq 1 30); do
              if nc -z 127.0.0.1 8333 >/dev/null 2>&1; then
                  S3_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${S3_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs swfs-filer swfs-s3 || true
              exit 1
          fi

          docker compose run --rm --no-deps sftpgo initprovider --config-file /etc/sftpgo/sftpgo.json
          docker compose up -d sftpgo
          SFTP_OK=false
          for _ in $(seq 1 25); do
              if docker exec "$(docker ps -qf name=sftpgo)" sftpgo ping --config-file /etc/sftpgo/sftpgo.json >/dev/null 2>&1; then
                  SFTP_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${SFTP_OK}" != "true" ]]; then
              docker compose logs sftpgo || true
              exit 1
          fi
          docker exec "$(docker ps -qf name=sftpgo)" sftpgo ping --config-file /etc/sftpgo/sftpgo.json
          echo "LIVE_STACK_SMOKE_OK"
