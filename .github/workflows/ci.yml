name: Ligament Vault CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
    inputs:
      scale_ha:
        description: "Extend the live VPS test with quorum scaling 3→4→5 and a replacement on a clean disk"
        type: boolean
        default: false
      vps_runner:
        description: "Ubuntu 24.04 runner label for the live VPS job (select an ephemeral runner with enough free space)"
        type: string
        default: ubuntu-24.04

jobs:
  validate-and-dry-run:
    name: ShellCheck, Web UI, Template Validation & Dry-Run Matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (age, shellcheck, python3-yaml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age apache2-utils shellcheck python3-yaml jq

      - name: Syntax check (bash -n, sh -n, python py_compile)
        run: |
          chmod +x install.sh ligactl clusterctl web/panel.py scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh scripts/hooks/*.sh
          for f in install.sh ligactl clusterctl scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh; do
            bash -n "$f"
          done
          sh -n scripts/hooks/ligament-2fa-hook.sh
          python3 -m compileall -q web scripts/lib scripts/ops tests

      - name: ShellCheck static analysis
        run: |
          shellcheck -x -S warning install.sh ligactl clusterctl scripts/lib/*.sh scripts/stages/*.sh scripts/ops/*.sh scripts/verify/*.sh scripts/hooks/*.sh

      - name: Render templates, test Web Panel HTTPS API & full CLI --dry-run matrix
        run: |
          WORKDIR="$(mktemp -d)"
          cp -R . "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          ./install.sh --dry-run

          ./ligactl config init
          source scripts/lib/common.sh
          config_db_set_many CLUSTER_NODES "10.0.1.10:dc1:node1 10.0.2.10:dc2:node2 10.0.3.10:dc3:node3" ARBITER_IP "198.51.100.50" \
            PANEL_PORT 18443 PANEL_BIND 127.0.0.1
          ./ligactl secrets status
          python3 -m unittest discover -s tests
          python3 -m unittest discover -s scripts/verify -p 'test_*.py'

          # YAML and inline JS syntax checks
          python3 - <<'PYEOF'
          import pathlib, re, subprocess, tempfile, yaml
          for p in pathlib.Path("configs/prometheus").glob("*.yml*"):
              raw = p.read_text(encoding="utf-8")
              # Substitute template vars for *.tpl files before YAML parse check
              rendered = re.sub(r"\$\{[A-Za-z0-9_]+\}", "placeholder", raw)
              yaml.safe_load(rendered)
              print(f"YAML OK: {p}")
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
          assert scripts, "No <script> block found in web/index.html"
          if subprocess.run(["bash", "-c", "command -v node >/dev/null"], check=False).returncode == 0:
              for idx, js in enumerate(scripts):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as tf:
                      tf.write(js)
                      tpath = tf.name
                  subprocess.run(["node", "--check", tpath], check=True)
                  print(f"JS syntax OK: script #{idx}")
          PYEOF

          # Live HTTPS integration test of Web Panel (:18443) using real age-encrypted secrets!
          EXTRACTED_PW=$(
            source scripts/lib/common.sh
            load_cluster_env "${WORKDIR}/repo"
            echo "${PANEL_ADMIN_PASSWORD:-${SFTPGO_ADMIN_PASSWORD}}"
          )
          python3 web/panel.py &
          PANEL_PID=$!
          trap 'kill "${PANEL_PID}" 2>/dev/null || true' EXIT
          sleep 2
          curl -ksf https://127.0.0.1:18443/api/v1/health | jq -e '.ok == true'
          curl -ksfD "${WORKDIR}/headers" -o "${WORKDIR}/panel.html" https://127.0.0.1:18443/
          grep -qi "X-Content-Type-Options: nosniff" "${WORKDIR}/headers"
          grep -qi "Content-Security-Policy:" "${WORKDIR}/headers"
          grep -q "Ligament Vault" "${WORKDIR}/panel.html"
          # Auth & injection failure checks
          BAD_CODE=$(curl -ks -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:18443/api/v1/auth/login -H "Content-Type: application/json" -d '{"username":"admin","password":"wrong"}')
          [[ "${BAD_CODE}" == "401" || "${BAD_CODE}" == "403" ]]
          UNAUTH_CODE=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/api/v1/overview)
          [[ "${UNAUTH_CODE}" == "401" ]]
          INJ_CODE=$(curl -ks -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${EXTRACTED_PW}" -H "Content-Type: application/json" -d '{"DOMAIN":"evil.com\nRUN_CMD=id"}' https://127.0.0.1:18443/api/v1/config)
          [[ "${INJ_CODE}" == "400" ]]

          curl -ksf -X POST https://127.0.0.1:18443/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"${EXTRACTED_PW}\"}" | jq -e '.ok == true'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview \
            | jq -e '.config.CLUSTER_SLUG == "ligament-vault" and .backup_configured == false'

          # Save S3 backup config with special chars ($, ", \) and verify age decrypt round-trip + overview
          python3 - "${EXTRACTED_PW}" <<'PYEOF'
          import json, ssl, sys, urllib.request
          pw = sys.argv[1]
          ctx = ssl._create_unverified_context()
          payload = {
              "BACKUP_S3_ENDPOINT": "https://s3.example.com",
              "BACKUP_S3_REGION": "eu-central-1",
              "BACKUP_S3_BUCKET": "vault-bk",
              "BACKUP_S3_ACCESS_KEY": "AK_CI_TEST",
              "BACKUP_S3_SECRET_KEY": 's3cr$t"key\\1',
          }
          req = urllib.request.Request(
              "https://127.0.0.1:18443/api/v1/config",
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"Bearer {pw}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, context=ctx, timeout=10) as r:
              assert r.status == 200, r.status
          PYEOF
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview \
            | jq -e '.backup_configured == true and .config.BACKUP_S3_REGION == "eu-central-1" and .config.BACKUP_S3_BUCKET == "vault-bk"'
          ROUNDTRIP_SK=$(
            source scripts/lib/common.sh
            load_cluster_env "${WORKDIR}/repo"
            printf '%s' "${BACKUP_S3_SECRET_KEY}"
          )
          python3 -c 'import sys; expected = "s3cr$t\"key\\1"; got = sys.argv[1]; assert got == expected, (got, expected)' "${ROUNDTRIP_SK}"

          # Preinstall node remove & task endpoint test via Panel API
          curl -ksf -X POST -H "Authorization: Bearer ${EXTRACTED_PW}" -H "Content-Type: application/json" \
            -d '{"CLUSTER_NODES":"10.0.1.10:dc1:node1 10.0.2.10:dc2:node2 10.0.3.10:dc3:node3 10.0.4.10:dc4:node4"}' \
            https://127.0.0.1:18443/api/v1/config >/dev/null
          curl -ksf -X POST -H "Authorization: Bearer ${EXTRACTED_PW}" -H "Content-Type: application/json" \
            -d '{"node":"node4","mode":"preinstall"}' \
            https://127.0.0.1:18443/api/v1/nodes/remove | jq -e '.ok == true'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/overview \
            | jq -e '(.health.nodes | length) == 3 and .health.nodes[2].node == "node3"'
          curl -ksf -H "Authorization: Bearer ${EXTRACTED_PW}" https://127.0.0.1:18443/api/v1/tasks | jq -e '.tasks | type == "array"'

          # Verify Bearer brute-force rate limit triggers 429 after 10 wrong tokens
          for _ in $(seq 1 10); do
              curl -ks -o /dev/null -H "Authorization: Bearer wrong_tok" https://127.0.0.1:18443/api/v1/overview
          done
          RL_CODE=$(curl -ks -o /dev/null -w '%{http_code}' -H "Authorization: Bearer wrong_tok" https://127.0.0.1:18443/api/v1/overview)
          [[ "${RL_CODE}" == "429" ]]

          # Verify ligament-2fa-hook.sh is strictly fail-closed on unexpected HTTP 200 without allowed=true
          python3 - <<'PY2FA'
          import http.server, json, pathlib, shutil, subprocess, tempfile, threading
          resp_body = b'{"status":"error_page"}'
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(resp_body)
          srv = http.server.HTTPServer(("127.0.0.1", 0), H)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          url = f"http://127.0.0.1:{srv.server_port}"
          hook_dir = pathlib.Path(tempfile.mkdtemp())
          hook = pathlib.Path(shutil.copy("scripts/hooks/ligament-2fa-hook.sh", hook_dir))
          (hook_dir / "ligament-2fa.json").write_text(json.dumps({
              "LIGAMENT_2FA_ENABLED":"true", "LIGAMENT_2FA_API_URL":url,
              "LIGAMENT_2FA_API_TOKEN":"ci-hook-token", "LIGAMENT_2FA_TIMEOUT_SEC":"5",
              "LIGAMENT_2FA_FAIL_OPEN":"false", "CLUSTER_SLUG":"ci",
          }))
          env = {"PATH": "/usr/bin:/bin", "SFTPGO_LOGIND_USER": '{"username":"alice"}', "SFTPGO_LOGIND_IP": "1.2.3.4", "SFTPGO_LOGIND_PROTOCOL": "SFTP", "SFTPGO_LOGIND_METHOD": "password"}
          r_deny = subprocess.run(["sh", str(hook)], env=env)
          assert r_deny.returncode != 0, "Expected fail-closed deny on missing allowed=true"
          resp_body = b'{"allowed":true}'
          r_ok = subprocess.run(["sh", str(hook)], env=env)
          assert r_ok.returncode == 0, "Expected allow when allowed=true"
          srv.shutdown()
          PY2FA
          kill "${PANEL_PID}"

          ./ligactl preflight --dry-run
          ./ligactl install --dry-run --yes
          ./ligactl install --stage=3 --dry-run --yes
          grep -q 'clientcert=verify-ca' "${WORKDIR}/repo/.rendered/node1/patroni.yml"
          grep -q '10.0.1.10/32 scram-sha-256 clientcert=verify-ca' "${WORKDIR}/repo/.rendered/node1/patroni.yml"
          grep -q 'ssl_min_protocol_version: "TLSv1.3"' "${WORKDIR}/repo/.rendered/node1/patroni.yml"
          grep -q 'sslcert=/certs/pg-client.crt' "${WORKDIR}/repo/.rendered/node1/sftpgo.json"
          grep -q 'pg1-port=15432' "${WORKDIR}/repo/.rendered/node1/pgbackrest.conf"
          test "$(grep -cE '^[[:space:]]*server node[123] ' "${WORKDIR}/repo/.rendered/node1/haproxy-pg.cfg")" = "3"
          python3 - "${WORKDIR}/repo/.rendered/node1/haproxy-pg.cfg" <<'PYHAP'
          import sys
          sec = None
          servers = 0
          for idx, raw in enumerate(open(sys.argv[1], encoding="utf-8"), 1):
              s = raw.strip()
              if not s or s.startswith("#"):
                  continue
              kw = s.split()[0]
              if kw in ("global", "defaults", "frontend", "backend", "listen"):
                  sec = kw
              elif sec is None:
                  raise SystemExit(f"haproxy-pg.cfg:{idx} directive '{kw}' out of section")
              elif kw == "server":
                  assert sec == "backend", f"server directive in section '{sec}' at line {idx}"
                  servers += 1
          assert servers == 3, f"Expected 3 server entries in multi-node haproxy-pg.cfg, got {servers}"
          PYHAP

          # Verify image mirror candidate resolution and pinned digest safety
          (
            set -euo pipefail
            export SCRIPT_DIR="${WORKDIR}/repo"
            export CONFIG_ROOT="${WORKDIR}/repo"
            source "${WORKDIR}/repo/scripts/lib/common.sh"
            source "${WORKDIR}/repo/scripts/lib/deploy.sh"
            load_cluster_env "${WORKDIR}/repo"
            _image_mirror_candidates "quay.io/coreos/etcd:v3.5.17" | grep -qx "gcr.io/etcd-development/etcd:v3.5.17"
            _image_mirror_candidates "haproxy:3.0-alpine" | grep -qx "mirror.gcr.io/library/haproxy:3.0-alpine"
            _image_mirror_candidates "chrislusf/seaweedfs:4.55" | grep -qx "mirror.gcr.io/chrislusf/seaweedfs:4.55"
            test "$(_image_mirror_candidates "quay.io/coreos/etcd:v3.5.17@sha256:0123456789abcdef" | wc -l | tr -d ' ')" = "1"
            test "$(_image_mirror_candidates "local/patroni-pg16:16" | wc -l | tr -d ' ')" = "1"
            test "$(resolve_service_image_ref etcd)" = "quay.io/coreos/etcd:v3.5.17"
            test "$(resolve_service_image_ref swfs-master)" = "chrislusf/seaweedfs:4.55"

            # Verify POSIX arg quoting used by remote_exec_stdin preserves empty args, spaces, leading hyphens, quotes, and newlines
            out_args=$(
              {
                printf 'set --'
                for a in "" "194.28.224.231 191.40.5.178 95.183.8.45" " -L 127.0.0.1:30201:10.0.0.2:2379" "it's \$RAW"; do
                  printf ' %s' "$(_shell_quote_posix "${a}")"
                done
                printf '\n'
                printf '%s\n' 'echo "N=$#|$1|$2|$3|$4"'
              } | bash -s
            )
            test "${out_args}" = "N=4||194.28.224.231 191.40.5.178 95.183.8.45| -L 127.0.0.1:30201:10.0.0.2:2379|it's \$RAW"
          )
          ./ligactl sync-config --dry-run
          ./ligactl user add --username alice --profile dual --quota-gb 50 --generate-password --require-2fa --dry-run
          ./ligactl user list --dry-run
          ./ligactl pki status --dry-run
          ./ligactl pki rotate --all --dry-run --yes
          ./ligactl backup --dry-run
          ./ligactl backup --verify --dry-run
          ./ligactl dr verify-backup --dry-run
          ./ligactl verify --sprint 1 --dry-run
          ./ligactl verify --disruptive --dry-run --yes
          ./ligactl status --json --dry-run
          ./ligactl scale add --ip 10.0.4.10 --dc dc4 --dry-run --yes
          ./ligactl scale replace --old node2 --new-ip 10.0.2.99 --dry-run --yes
          ./ligactl scale expand-disk --node node1 --dir /mnt/nvme2 --max-volumes 10 --dry-run
          ./ligactl upgrade --dry-run --yes
          ./ligactl dr restore --latest --dry-run --yes
          ./ligactl publish-image --dry-run
          ./ligactl lab up --dry-run

          python3 -m json.tool configs/grafana/ligament-vault-dashboard.json >/dev/null

  live-patroni-etcd-bootstrap:
    name: Live Container Smoke Test (etcd mTLS + Patroni PG16 Bootstrap)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Patroni PG16 image
        run: docker build -t aligorov/ligament_vault_patroni:16 -f Dockerfile.patroni .

      - name: Bootstrap live mTLS etcd + Patroni + HAProxy and verify /primary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age apache2-utils jq
          HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
          WORKDIR="$(mktemp -d)"
          cp -R . "${WORKDIR}/repo"
          cd "${WORKDIR}/repo"

          ./ligactl config init
          source scripts/lib/common.sh
          source scripts/lib/deploy.sh
          config_db_set_many CLUSTER_NODES "${HOST_IP}:dc1:node1" SWFS_DEFAULT_REPLICATION 000 \
              SWFS_ADMIN_NODE_INDEX 1 QUORUM_NODES node1 HTTPS_PORT 8444 \
              ETCD_DATA_DIR "${WORKDIR}/data/etcd" PG_DATA_DIR "${WORKDIR}/data/postgresql" \
              SWFS_MASTER_DIR "${WORKDIR}/data/swfs-master" SWFS_VOLUME_DIR "${WORKDIR}/data/seaweedfs" \
              SFTPGO_DATA_DIR "${WORKDIR}/data/sftpgo" SFTPGO_TEMP_PATH "${WORKDIR}/data/sftpgo-temp"
          load_cluster_env "${WORKDIR}/repo"
          mkdir -p "${ETCD_DATA_DIR}" "${PG_DATA_DIR}" "${SWFS_MASTER_DIR}" "${SWFS_VOLUME_DIR}" "${SFTPGO_DATA_DIR}"/{data,backups,client-logs,audit-spool} "${SFTPGO_TEMP_PATH}"
          sudo chown -R 1000:1000 "${SFTPGO_DATA_DIR}" "${SFTPGO_TEMP_PATH}" "${SWFS_MASTER_DIR}" "${SWFS_VOLUME_DIR}"

          ensure_ca_exists
          CA_DIR="${WORKDIR}/repo/.pki/ca"
          CERT_OUT="${WORKDIR}/repo/certs/node1"
          mkdir -p "${CERT_OUT}"
          cp "${CA_DIR}/ca.crt" "${CERT_OUT}/ca.crt"
          cp "${CA_DIR}/ca.crt" "${WORKDIR}/repo/certs/ca.crt"
          cp "${CA_DIR}/crl.pem" "${CERT_OUT}/crl.pem"
          cp "${CA_DIR}/crl.pem" "${CERT_OUT}/ca-crl.crt"
          chmod 644 "${CERT_OUT}/crl.pem" "${CERT_OUT}/ca-crl.crt" "${CERT_OUT}/ca.crt" "${WORKDIR}/repo/certs/ca.crt"
          SAN="IP:${HOST_IP},IP:127.0.0.1,DNS:node1,DNS:localhost"
          ACTIVE_CA_KEY="${CA_DIR}/ca.key"
          for role in "${PKI_ROLES[@]}"; do
              openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:prime256v1 -out "${CERT_OUT}/${role}.key" 2>/dev/null
              openssl req -new -sha256 -key "${CERT_OUT}/${role}.key" -out "${CERT_OUT}/${role}.csr" -subj "/CN=${role}/O=Ligament"
              _sign_csr_with_active_ca "${CA_DIR}" "${CERT_OUT}/${role}.csr" "${CERT_OUT}/${role}.crt" "${SAN}"
              chmod 644 "${CERT_OUT}/${role}.crt"
          done
          chmod 600 "${CERT_OUT}"/*.key
          sudo chown 1000:1000 "${CERT_OUT}"/swfs-*.key "${CERT_OUT}/pg-client.key" || true
          chmod 644 "${CERT_OUT}"/etcd-*.key "${CERT_OUT}/pg-server.key"

          mkdir -p "${WORKDIR}/repo/certs/ssl" "${WORKDIR}/repo/ssh-host-keys" "${WORKDIR}/repo/hooks"
          openssl req -x509 -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 7 \
              -keyout "${WORKDIR}/repo/certs/ssl/privkey.pem" \
              -out "${WORKDIR}/repo/certs/ssl/fullchain.pem" \
              -subj "/CN=files.company.com" -addext "subjectAltName=DNS:files.company.com" 2>/dev/null
          sudo chown 1000:1000 "${WORKDIR}/repo/certs/ssl/privkey.pem"
          chmod 644 "${WORKDIR}/repo/certs/ssl/fullchain.pem"
          ssh-keygen -t ed25519 -f "${WORKDIR}/repo/ssh-host-keys/id_ed25519" -N "" >/dev/null
          ssh-keygen -t ecdsa -b 256 -f "${WORKDIR}/repo/ssh-host-keys/id_ecdsa" -N "" >/dev/null
          ssh-keygen -t rsa -b 2048 -f "${WORKDIR}/repo/ssh-host-keys/id_rsa" -N "" >/dev/null
          chmod 600 "${WORKDIR}/repo"/ssh-host-keys/id_*
          chmod 644 "${WORKDIR}/repo"/ssh-host-keys/*.pub
          sudo chown 1000:1000 "${WORKDIR}/repo"/ssh-host-keys/id_*

          render_node_configs "${HOST_IP}" "dc1" "node1" "1" "new"
          RDIR="${WORKDIR}/repo/.rendered/node1"
          cp "${RDIR}/docker-compose.yml" "${WORKDIR}/repo/docker-compose.yml"
          test ! -e "${RDIR}/.env"
          cp "${RDIR}/sftpgo-bootstrap.json" "${RDIR}/client-audit.json" configs/
          cp scripts/ops/start-patroni.sh scripts/ops/client-audit.py configs/
          cp "${RDIR}/hooks/ligament-2fa.json" scripts/hooks/ligament-2fa-hook.sh hooks/
          jq -er '.admins[0].password | startswith("$2")' configs/sftpgo-bootstrap.json
          sudo chown 1000:1000 configs/sftpgo-bootstrap.json configs/client-audit.json hooks/ligament-2fa.json
          sudo chmod 600 configs/sftpgo-bootstrap.json configs/client-audit.json hooks/ligament-2fa.json
          mkdir -p "${WORKDIR}/repo/configs/seaweedfs"
          cp "${RDIR}/patroni.yml" "${WORKDIR}/repo/configs/patroni.yml"
          cp "${RDIR}/haproxy-pg.cfg" "${WORKDIR}/repo/configs/haproxy-pg.cfg"
          cp "${RDIR}/pgbackrest.conf" "${WORKDIR}/repo/configs/pgbackrest.conf"
          cp "${RDIR}/sftpgo.json" "${WORKDIR}/repo/configs/sftpgo.json"
          cp "${RDIR}/revoked_user_certs.json" "${WORKDIR}/repo/configs/revoked_user_certs.json"
          cp "${RDIR}"/seaweedfs/* "${WORKDIR}/repo/configs/seaweedfs/"
          chmod 755 "${WORKDIR}" "${WORKDIR}/repo" "${WORKDIR}/repo/configs" "${WORKDIR}/repo/configs/seaweedfs" "${WORKDIR}/repo/certs" "${CERT_OUT}" "${WORKDIR}/repo/certs/ssl" "${WORKDIR}/repo/ssh-host-keys" "${WORKDIR}/repo/hooks"
          chmod 644 "${WORKDIR}/repo/configs/haproxy-pg.cfg" "${WORKDIR}/repo/docker-compose.yml"
          chmod 600 "${WORKDIR}/repo/configs/seaweedfs/"*.toml "${WORKDIR}/repo/configs/seaweedfs/s3.json"
          sudo chown 1000:1000 "${WORKDIR}/repo/configs/sftpgo.json" "${WORKDIR}/repo/configs/revoked_user_certs.json" "${WORKDIR}/repo/configs/seaweedfs/"*.toml "${WORKDIR}/repo/configs/seaweedfs/s3.json"

          cleanup() {
              docker compose -f "${WORKDIR}/repo/docker-compose.yml" down -v || true
          }
          trap cleanup EXIT

          docker compose up -d etcd
          ETCD_OK=false
          for _ in $(seq 1 25); do
              if docker exec "$(docker ps -qf name=etcd)" etcdctl \
                  --endpoints="https://127.0.0.1:2379" \
                  --cacert=/certs/ca.crt --cert=/certs/etcd-client.crt --key=/certs/etcd-client.key \
                  endpoint health >/dev/null 2>&1; then
                  ETCD_OK=true
                  break
              fi
              sleep 1
          done
          if [[ "${ETCD_OK}" != "true" ]]; then
              docker compose ps -a || true
              docker compose logs etcd || true
              exit 1
          fi

          docker compose up -d patroni
          PRIMARY_OK=false
          for _ in $(seq 1 45); do
              if curl -sf --cacert "${CERT_OUT}/ca.crt" https://127.0.0.1:8008/primary >/dev/null; then
                  PRIMARY_OK=true
                  break
              fi
              sleep 2
          done
          if [[ "${PRIMARY_OK}" != "true" ]]; then
              docker compose logs patroni || true
              curl -sk https://127.0.0.1:8008/patroni || true
              exit 1
          fi
          docker exec "$(docker ps -qf name=patroni)" patronictl -c /run/pg-certs/patroni.yml list

          # Verify Patroni REST API rejects plaintext HTTP and enforces client cert on unsafe PATCH
          if curl -sf http://127.0.0.1:8008/primary >/dev/null 2>&1; then
              echo "SECURITY FAILURE: Patroni REST API responded over plaintext HTTP!" >&2
              exit 1
          fi
          if curl -sf --cacert "${CERT_OUT}/ca.crt" -u "patroni:${PATRONI_API_PASSWORD}" -X PATCH -H "Content-Type: application/json" -d '{}' https://127.0.0.1:8008/config >/dev/null 2>&1; then
              echo "SECURITY FAILURE: Patroni REST API allowed PATCH without client cert!" >&2
              exit 1
          fi

          docker compose up -d haproxy
          HAPROXY_OK=false
          for _ in $(seq 1 15); do
              if nc -z 127.0.0.1 5433 2>/dev/null; then
                  HAPROXY_OK=true
                  break
              fi
              sleep 1
          done
          if [[ "${HAPROXY_OK}" != "true" ]]; then
              docker compose ps -a || true
